<svg xmlns="http://www.w3.org/2000/svg" width="770" height="430" viewBox="0 0 770 430" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" role="img">
<title>Evasion transfer from successful targeted evasions (ETR)</title>
<desc>R2-D_S transfer behavior.</desc>
<rect x="0" y="0" width="770" height="430" fill="#fcfcfb"/>
<text x="16.00" y="24.00" font-size="14" text-anchor="start" fill="#0b0b0b" font-weight="bold">Evasion transfer from successful targeted evasions (ETR)</text>
<text x="16.00" y="42.00" font-size="10" text-anchor="start" fill="#52514e" font-weight="normal">ETR = joint evasions / target evasions</text>
<text x="10.00" y="84.00" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="bold">R2-D_S (104 D_S evasions)</text>
<line x1="44.00" y1="358.00" x2="254.00" y2="358.00" stroke="#b9b8b2" stroke-width="1.20"/>
<text x="40.00" y="361.50" font-size="9" text-anchor="end" fill="#52514e" font-weight="normal">0%</text>
<line x1="44.00" y1="305.20" x2="254.00" y2="305.20" stroke="#e6e5e0" stroke-width="1.00"/>
<text x="40.00" y="308.70" font-size="9" text-anchor="end" fill="#52514e" font-weight="normal">20%</text>
<line x1="44.00" y1="252.40" x2="254.00" y2="252.40" stroke="#e6e5e0" stroke-width="1.00"/>
<text x="40.00" y="255.90" font-size="9" text-anchor="end" fill="#52514e" font-weight="normal">40%</text>
<line x1="44.00" y1="199.60" x2="254.00" y2="199.60" stroke="#e6e5e0" stroke-width="1.00"/>
<text x="40.00" y="203.10" font-size="9" text-anchor="end" fill="#52514e" font-weight="normal">60%</text>
<line x1="44.00" y1="146.80" x2="254.00" y2="146.80" stroke="#e6e5e0" stroke-width="1.00"/>
<text x="40.00" y="150.30" font-size="9" text-anchor="end" fill="#52514e" font-weight="normal">80%</text>
<line x1="44.00" y1="94.00" x2="254.00" y2="94.00" stroke="#e6e5e0" stroke-width="1.00"/>
<text x="40.00" y="97.50" font-size="9" text-anchor="end" fill="#52514e" font-weight="normal">100%</text>
<text x="99.00" y="372.00" font-size="9" text-anchor="middle" fill="#52514e" font-weight="normal">to D_M-B</text>
<rect x="86.00" y="358.00" width="26.00" height="0.00" rx="2.00" fill="#2a78d6"><title>R2-D_S ETR to D_M-B</title></rect>
<line x1="99.00" y1="358.00" x2="99.00" y2="358.00" stroke="#52514e" stroke-width="1.00"/>
<line x1="96.00" y1="358.00" x2="102.00" y2="358.00" stroke="#52514e" stroke-width="1.00"/>
<line x1="96.00" y1="358.00" x2="102.00" y2="358.00" stroke="#52514e" stroke-width="1.00"/>
<text x="99.00" y="355.00" font-size="7.5" text-anchor="middle" fill="#0b0b0b" font-weight="normal">0/104</text>
<text x="201.00" y="372.00" font-size="9" text-anchor="middle" fill="#52514e" font-weight="normal">to D_G</text>
<rect x="188.00" y="99.08" width="26.00" height="258.92" rx="2.00" fill="#2a78d6"><title>R2-D_S ETR to D_G</title></rect>
<line x1="201.00" y1="116.96" x2="201.00" y2="94.00" stroke="#52514e" stroke-width="1.00"/>
<line x1="198.00" y1="116.96" x2="204.00" y2="116.96" stroke="#52514e" stroke-width="1.00"/>
<line x1="198.00" y1="94.00" x2="204.00" y2="94.00" stroke="#52514e" stroke-width="1.00"/>
<text x="201.00" y="91.00" font-size="7.5" text-anchor="middle" fill="#0b0b0b" font-weight="normal">102/104</text>
<text x="272.00" y="84.00" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="bold">R2-DMB</text>
<rect x="294.00" y="102.00" width="204.00" height="250.00" rx="4.00" fill="#f0efec"></rect>
<text x="396.00" y="227.00" font-size="10" text-anchor="middle" fill="#52514e" font-weight="normal">UNDEFINED: 0 target evasions</text>
<text x="522.00" y="84.00" font-size="11" text-anchor="start" fill="#0b0b0b" font-weight="bold">R3</text>
<rect x="544.00" y="102.00" width="204.00" height="250.00" rx="4.00" fill="#f0efec"></rect>
<text x="646.00" y="227.00" font-size="10" text-anchor="middle" fill="#52514e" font-weight="normal">NOT_APPLICABLE: target ALL</text>
<text x="16.00" y="418.00" font-size="8.5" text-anchor="start" fill="#52514e" font-weight="normal">Frozen conditional ETR; not a detector-independent transfer probability.</text>
</svg>
